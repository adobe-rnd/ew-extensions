<!DOCTYPE html>
<html>
  <head>
    <title>Block editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <style>
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--s2-gray-25, #fff);
        color: var(--s2-gray-900, #131313);
        font-family: var(--s2-font-family, sans-serif);
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
    <script type="module">
      try {
        const { runtime } = await import('./runtime.js');
        const map = document.createElement('script');
        map.type = 'importmap';
        map.textContent = JSON.stringify({ imports: { 'da-lit': `${runtime.live}/deps/lit/dist/index.js` } });
        document.head.append(map);
        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = `${runtime.nx2}/styles/styles.css`;
        document.head.append(css);
        await import('./block-editor.js');
      } catch (error) {
        document.body.textContent = `Unable to start block editor: ${error.message}`;
      }
    </script>
  </head>
  <body><ew-block-properties></ew-block-properties></body>
</html>
